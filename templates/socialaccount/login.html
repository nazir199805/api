<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sign in with Google</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full text-center">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo" class="w-12 mx-auto mb-6" />
        <h1 class="text-2xl font-semibold mb-4">Sign in with Google</h1>
        <p class="mb-6 text-gray-600">Choose your Google account to continue.</p>

        <button
            onclick="window.location.href='https://accounts.google.com/o/oauth2/v2/auth/oauthchooseaccount?client_id=546605370258-l8ecnn762q3ftcu7teg7cjlb077534a1.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A8000%2Faccounts%2Fgoogle%2Flogin%2Fcallback%2F&scope=profile%20email&response_type=code&state=0KvdUBvucrEwI1vP&prompt=select_account&access_type=online&service=lso&o2v=2&flowName=GeneralOAuthFlow';"
            class="bg-blue-600 text-white px-6 py-3 rounded-md hover:bg-blue-700 transition"
        >
            Continue with Google
        </button>
    </div>
</body>
</html>
